<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Rounded Base in International Banking Navy -->
  <rect width="100" height="100" rx="22" fill="#0A1D37" />
  
  <!-- Outer Subtle Tech Border -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#1E3A8A" stroke-width="2" />

  <!-- Global Interbank Wire Globe -->
  <g transform="translate(50, 40)">
    <!-- Globe Outer Ring -->
    <circle cx="0" cy="0" r="24" stroke="#F97316" stroke-width="2.5" fill="#0F294D" />
    
    <!-- Parallels (Latitude lines) -->
    <ellipse cx="0" cy="-8" rx="22" ry="7" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" fill="none" />
    <line x1="-24" y1="0" x2="24" y2="0" stroke="#F97316" stroke-width="1.5" stroke-opacity="0.9" />
    <ellipse cx="0" cy="8" rx="22" ry="7" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" fill="none" />
    
    <!-- Meridians (Longitude lines) -->
    <ellipse cx="0" cy="0" rx="13" ry="24" stroke="#38BDF8" stroke-width="1.5" fill="none" />
    <ellipse cx="0" cy="0" rx="6" ry="24" stroke="#60A5FA" stroke-width="1" fill="none" />
    <line x1="0" y1="-24" x2="0" y2="24" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Active Transaction Signal Dot -->
    <circle cx="9" cy="-7" r="3.5" fill="#F97316" />
    <circle cx="9" cy="-7" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- SWIFT Official Brand Wordmark & Global Wire Badge -->
  <g transform="translate(50, 75)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
      SWIFT
    </text>
    <rect x="-34" y="6" width="68" height="12" rx="6" fill="#F97316" />
    <text x="0" y="15" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      WIRE • ACH
    </text>
  </g>
</svg>