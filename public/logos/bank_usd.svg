<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="usdBankGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="url(#usdBankGrad)" />
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#334155" strokeWidth="1.5" />
  
  <!-- Global Financial Grid Lines (SWIFT Network) -->
  <circle cx="50" cy="50" r="32" stroke="#38BDF8" strokeWidth="1.5" strokeOpacity="0.4" />
  <ellipse cx="50" cy="50" rx="16" ry="32" stroke="#38BDF8" strokeWidth="1.5" strokeOpacity="0.4" />
  <line x1="18" y1="50" x2="82" y2="50" stroke="#38BDF8" strokeWidth="1.5" strokeOpacity="0.4" />
  
  <!-- Architectural Bank Columns in Foreground -->
  <g fill="#FFFFFF">
    <polygon points="50,22 24,35 76,35" fill="#38BDF8" />
    <rect x="22" y="35" width="56" height="3" rx="1" />
    <!-- Pillars -->
    <rect x="28" y="40" width="6" height="24" rx="1" />
    <rect x="40" y="40" width="6" height="24" rx="1" />
    <rect x="54" y="40" width="6" height="24" rx="1" />
    <rect x="66" y="40" width="6" height="24" rx="1" />
    <!-- Steps -->
    <rect x="20" y="66" width="60" height="3" rx="1" fill="#38BDF8" />
    <rect x="16" y="70" width="68" height="4" rx="1" />
  </g>
  
  <!-- Center Golden USD Badge -->
  <circle cx="50" cy="52" r="8" fill="#FBBF24" />
  <text x="50" y="56" text-anchor="middle" fill="#0F172A" font-size="11" font-weight="900" font-family="system-ui, sans-serif">$</text>
</svg>
