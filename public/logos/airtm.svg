<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="airtmOfficialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#00A3FF" />
      <stop offset="100%" stopColor="#0066F6" />
    </linearGradient>
  </defs>

  <!-- Airtm Official Electric Blue Rounded Badge -->
  <rect width="100" height="100" rx="22" fill="url(#airtmOfficialBg)" />
  
  <!-- Subtle inner glowing border -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Airtm Iconic Multi-Node Network Cloud Wing Symbol -->
  <g transform="translate(50, 40)">
    <!-- Connection lines -->
    <path d="M-22 6 L-8 -12 L10 -12 L22 6 L12 16 L-10 16 Z" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round" fill="#FFFFFF" fill-opacity="0.15" />
    <line x1="-8" y1="-12" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="-12" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="-22" y1="6" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="22" y1="6" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="16" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
    <line x1="12" y1="16" x2="0" y2="4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

    <!-- Node circles -->
    <circle cx="-22" cy="6" r="4.5" fill="#FFFFFF" />
    <circle cx="-8" cy="-12" r="4.5" fill="#FFFFFF" />
    <circle cx="10" cy="-12" r="4.5" fill="#FFFFFF" />
    <circle cx="22" cy="6" r="4.5" fill="#FFFFFF" />
    <circle cx="-10" cy="16" r="4.5" fill="#FFFFFF" />
    <circle cx="12" cy="16" r="4.5" fill="#FFFFFF" />
    
    <!-- Central Hub node -->
    <circle cx="0" cy="4" r="6" fill="#FFFFFF" />
    <circle cx="0" cy="4" r="3" fill="#0066F6" />
  </g>

  <!-- Airtm Official Wordmark -->
  <g transform="translate(50, 78)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
      airtm
    </text>
  </g>
</svg>
