<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <rect width="100" height="100" rx="22" fill="#5400FF" />
  <defs>
    <linearGradient id="palmGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#25F49B" />
      <stop offset="100%" stopColor="#00D287" />
    </linearGradient>
  </defs>
  <!-- PalmPay Iconic Smiling Palm/Hand -->
  <g transform="translate(16, 20)">
    <!-- Base palm curve -->
    <path
      d="M10 38C10 50 20 60 34 60C48 60 58 50 58 38C58 26 48 18 34 18C20 18 10 26 10 38Z"
