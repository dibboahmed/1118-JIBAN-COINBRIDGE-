    />
    <!-- White Inner Smile / Coin Cradle -->
    <path
      d="M20 38C20 45 26 51 34 51C42 51 48 45 48 38C48 31 42 27 34 27C26 27 20 31 20 38Z"
      fill="#5400FF"
    />
    <!-- White Coin / Heart Emblem -->
    <circle cx="34" cy="38" r="7" fill="#FFFFFF" />
    <!-- 4 Leaf/Finger Petals on Top -->
    <ellipse cx="22" cy="14" rx="4" ry="7" transform="rotate(-25 22 14)" fill="url(#palmGreen)" />
    <ellipse cx="30" cy="9" rx="4" ry="8" transform="rotate(-8 30 9)" fill="url(#palmGreen)" />
    <ellipse cx="38" cy="9" rx="4" ry="8" transform="rotate(8 38 9)" fill="url(#palmGreen)" />
    <ellipse cx="46" cy="14" rx="4" ry="7" transform="rotate(25 46 14)" fill="url(#palmGreen)" />
  </g>
</svg>
