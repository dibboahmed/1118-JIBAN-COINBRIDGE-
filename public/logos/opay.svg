<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- OPay Signature Emerald Green Rounded Badge -->
  <rect width="100" height="100" rx="22" fill="#00B875" />
  
  <!-- Subtle inner border -->
  <rect x="2" y="2" width="96" height="96" rx="20" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- OPay Official Logo Mark (Open Loop with Center Dot) -->
  <g transform="translate(50, 40)">
    <!-- Outer Open Ring -->
    <path
      d="M0 -22 C12.15 -22 22 -12.15 22 0 C22 12.15 12.15 22 0 22 C-12.15 22 -22 12.15 -22 0 C-22 -8.5 -17.2 -15.8 -10 -19.5"
      stroke="#FFFFFF"
      stroke-width="8.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Center Solid Dot -->
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF" />
  </g>

  <!-- OPay Official Wordmark -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="19" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.5">
      OPay
    </text>
  </g>
</svg>